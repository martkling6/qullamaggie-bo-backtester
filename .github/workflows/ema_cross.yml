name: NASDAQ Technology EMA Crossover Backtest
on:
  workflow_dispatch:
    inputs:
      max_symbols:
        description: "200 for trial; 0 for all matching NASDAQ technology stocks"
        default: "200"
        required: true
      include_delisted:
        description: "Include delisted stocks when EODHD supplies sector metadata"
        type: boolean
        default: true
      start:
        description: "Backtest start YYYY-MM-DD"
        default: "2015-01-01"
        required: true
      leverage:
        description: "Assumed CFD leverage (not broker-specific)"
        default: "5"
        required: true
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Unit tests
        run: python -m pytest -q
      - name: Run EMA crossover scenarios
        env:
          EODHD_API_TOKEN: ${{ secrets.EODHD_API_TOKEN }}
        run: |
          FLAGS=""
          if [ "${{ inputs.include_delisted }}" = "true" ]; then FLAGS="--include-delisted"; fi
          python -m src.ema_cross --start "${{ inputs.start }}" --max-symbols "${{ inputs.max_symbols }}" --leverage "${{ inputs.leverage }}" --workers 8 $FLAGS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nasdaq-ema-crossover-results
          path: results/ema_cross/
          if-no-files-found: warn
