name: BO Backtest
on:
  workflow_dispatch:
    inputs:
      symbols:
        description: "Comma-separated EODHD symbols"
        required: false
        default: "AAPL.US,NVDA.US,TSLA.US,AMD.US,PLTR.US"
      include_delisted:
        description: "Use active + delisted US universe (limited by --limit)"
        type: boolean
        required: false
        default: false
      limit:
        description: "Universe limit for validation"
        required: false
        default: "50"
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run validation backtest
        env:
          EODHD_API_TOKEN: ${{ secrets.EODHD_API_TOKEN }}
        run: |
          FLAGS=""
          if [ "${{ inputs.include_delisted }}" = "true" ]; then FLAGS="--include-delisted"; fi
          python -m src.cli --symbols "${{ inputs.symbols }}" --limit "${{ inputs.limit }}" $FLAGS
      - uses: actions/upload-artifact@v4
        with:
          name: bo-backtest-results
          path: results/
